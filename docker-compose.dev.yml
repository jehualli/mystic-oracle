services:
  db:
    image: postgres:16-alpine
    container_name: mystic_oracle_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mystic_oracle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysticpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: mystic_oracle_app_dev
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:mysticpassword@db:5432/mystic_oracle
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "apk add --no-cache openssl && npm install && npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data_dev:

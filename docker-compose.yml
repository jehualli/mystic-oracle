services:
  db:
    image: postgres:16-alpine
    container_name: mystic_oracle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mystic_oracle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysticpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystic_oracle_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:mysticpassword@db:5432/mystic_oracle
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node node_modules/prisma/build/index.js db push --accept-data-loss && node server.js"

volumes:
  postgres_data:
